services:
  api:
    image: ghcr.io/plastic-labs/honcho:latest
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://honcho:honcho@database:5432/honcho
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      - VECTOR_STORE_TYPE=pgvector
    volumes:
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
        content: |
          [llm]
          OPENAI_API_KEY = "sk-or-v1-dabbc9fc6240a22c24d2a306af75f737561015bca337345d90b7b00eaa38a5e3d"
          [deriver.model_config]
          transport = "openai"
          model = "google/gemini-2.5-flash"
          [deriver.model_config.overrides]
          base_url = "https://openrouter.ai/api/v1"
          [dialectic.levels.low.model_config]
          transport = "openai"
          model = "google/gemini-2.5-flash"
          [dialectic.levels.low.model_config.overrides]
          base_url = "https://openrouter.ai/api/v1"
          [embedding.model_config]
          transport = "openai"
          model = "openai/text-embedding-3-small"
          [embedding.model_config.overrides]
          base_url = "https://openrouter.ai/api/v1"
          [vector_store]
          TYPE = "pgvector"
    restart: unless-stopped

  deriver:
    image: ghcr.io/plastic-labs/honcho:latest
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://honcho:honcho@database:5432/honcho
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      - METRICS_ENABLED=false
      - VECTOR_STORE_TYPE=pgvector
    volumes:
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
        content: |
          [llm]
          OPENAI_API_KEY = "sk-or-v1-dabbc9fc6240a22c24d2a306af75f737561015bca337345d90b7b00eaa38a5e3d"
          [deriver.model_config]
          transport = "openai"
          model = "google/gemini-2.5-flash"
          [deriver.model_config.overrides]
          base_url = "https://openrouter.ai/api/v1"
          [dialectic.levels.low.model_config]
          transport = "openai"
          model = "google/gemini-2.5-flash"
          [dialectic.levels.low.model_config.overrides]
          base_url = "https://openrouter.ai/api/v1"
          [embedding.model_config]
          transport = "openai"
          model = "openai/text-embedding-3-small"
          [embedding.model_config.overrides]
          base_url = "https://openrouter.ai/api/v1"
          [vector_store]
          TYPE = "pgvector"
    restart: unless-stopped

  database:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      - POSTGRES_DB=honcho
      - POSTGRES_USER=honcho
      - POSTGRES_PASSWORD=honcho
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redis-data:
